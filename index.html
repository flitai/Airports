<!-- 图标内联成 data URI：外部 .ico 在 file:// 下取不到，而且多一次请求。SVG 里只能用
     单引号（双引号会撑破 href 属性），# 必须写成 %23 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563eb'/><path fill='%23fff' d='M16 5c1.2 0 2.1 2 2.1 4.4v3.4l9.2 5.5v2.6l-9.2-2.7v5.5l3 2.2v2.2L16 26.5 10.9 28v-2.2l3-2.2v-5.5l-9.2 2.7v-2.6l9.2-5.5V9.4C13.9 7 14.8 5 16 5z'/></svg>">

<style>
  :root{
    --bg:#ffffff; --panel:#f7f8fa; --line:#e3e6ea; --ink:#1c2128; --dim:#6b7280;
    --accent:#2563eb; --shadow:0 2px 12px rgba(16,24,40,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;color:var(--ink)}
  body{display:flex;overflow:hidden}

  /* ---------- 左侧筛选栏 ---------- */
  #side{width:286px;flex:none;background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column;z-index:3}
  #side h1{margin:0;padding:14px 16px 12px;font-size:15px;font-weight:600;border-bottom:1px solid var(--line)}
  #side h1 small{display:block;font-weight:400;font-size:11px;color:var(--dim);margin-top:3px}
  #scroll{flex:1;overflow-y:auto;padding:12px 16px 16px}
  .grp{margin-bottom:18px}
  .grp>label.t{display:block;font-size:11px;font-weight:600;color:var(--dim);
               letter-spacing:.06em;text-transform:uppercase;margin-bottom:7px}
  .row{display:flex;align-items:center;gap:7px;padding:2px 0;cursor:pointer;user-select:none}
  .row input{margin:0;cursor:pointer;flex:none}
  .row .sw{width:9px;height:9px;border-radius:50%;flex:none}
  .row .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .c{color:var(--dim);font-variant-numeric:tabular-nums;font-size:11px}
  select,input[type=search]{width:100%;padding:6px 8px;border:1px solid var(--line);
        border-radius:6px;background:#fff;font:inherit;color:inherit}
  input[type=range]{width:100%;margin:6px 0 0}
  #count{padding:9px 16px;border-top:1px solid var(--line);background:#fff;
         font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  #count b{color:var(--ink)}

  /* ---------- 地图 ---------- */
  #wrap{flex:1;position:relative;min-width:0}
  #map{position:absolute;inset:0;background:#eef1f5}
  #search{position:absolute;top:12px;left:12px;width:300px;z-index:4}
  #search input{box-shadow:var(--shadow);border-color:transparent}
  #results{margin-top:4px;background:#fff;border-radius:8px;box-shadow:var(--shadow);
           max-height:340px;overflow-y:auto;display:none}
  #results.on{display:block}
  .hit{padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
  .hit:last-child{border-bottom:0}
  .hit:hover{background:#eef2ff}
  .hit b{font-weight:600}
  .hit span{display:block;color:var(--dim);font-size:11px;margin-top:1px}
  #tip{position:absolute;z-index:5;pointer-events:none;display:none;background:rgba(28,33,40,.92);
       color:#fff;padding:4px 8px;border-radius:5px;font-size:12px;white-space:nowrap;
       transform:translate(-50%,-165%)}
  #boot{position:absolute;inset:0;z-index:9;background:#eef1f5;display:flex;
        align-items:center;justify-content:center;color:var(--dim);font-size:13px}
  #note{position:absolute;left:12px;bottom:8px;z-index:4;font-size:11px;color:var(--dim);
        background:rgba(255,255,255,.86);padding:3px 8px;border-radius:5px}
  #note a{color:var(--dim)}
  #baseAttrib a{color:var(--dim)}

  /* ---------- 右侧详情 ---------- */
  #detail{position:absolute;top:0;right:0;bottom:0;width:370px;background:#fff;
          border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:6;
          transform:translateX(100%);transition:transform .18s ease;
          display:flex;flex-direction:column}
  #detail.on{transform:none}
  #dhead{padding:14px 16px;border-bottom:1px solid var(--line);position:relative}
  #dhead h2{margin:0 24px 0 0;font-size:15px;font-weight:600;line-height:1.35}
  #dhead .sub{color:var(--dim);font-size:12px;margin-top:3px}
  #close{position:absolute;top:12px;right:12px;width:22px;height:22px;border:0;background:none;
         cursor:pointer;color:var(--dim);font-size:17px;line-height:1;padding:0}
  #dbody{flex:1;overflow-y:auto;padding:14px 16px 24px}
  .badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;
         color:#fff;vertical-align:1px}
  .sec{margin-top:16px}
  .sec>h3{margin:0 0 7px;font-size:11px;font-weight:600;color:var(--dim);
          letter-spacing:.06em;text-transform:uppercase}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:500;font-size:11px}
  td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
  dl{margin:0;display:grid;grid-template-columns:76px 1fr;gap:3px 10px;font-size:12px}
  dt{color:var(--dim)}
  dd{margin:0;word-break:break-word}
  .empty{color:var(--dim);font-size:12px;padding:6px 0}
  .lnk a{color:var(--accent);text-decoration:none;margin-right:12px;font-size:12px}
  .lnk a:hover{text-decoration:underline}
  .hint{color:var(--dim);font-size:11px;margin-top:5px;line-height:1.45}

  /* ---------- 航图 ---------- */
  .cgrp{margin-top:9px}
  .cgrp:first-child{margin-top:0}
  .cgrp>b{display:block;font-size:11px;font-weight:600;color:var(--dim);margin-bottom:2px}
  .cgrp a{display:block;color:var(--accent);text-decoration:none;font-size:12px;
          padding:2px 0;line-height:1.35;cursor:pointer}
  .cgrp a:hover{text-decoration:underline}
  #chart{position:fixed;inset:0;z-index:20;background:rgba(17,20,24,.6);display:none}
  #chart.on{display:flex}
  #chartBox{margin:auto;width:min(1100px,94vw);height:94vh;background:#fff;border-radius:8px;
            display:flex;flex-direction:column;overflow:hidden;box-shadow:0 16px 56px rgba(0,0,0,.4)}
  #chartHead{display:flex;align-items:center;gap:12px;flex:none;
             padding:9px 12px;border-bottom:1px solid var(--line)}
  #chartHead h4{margin:0;font-size:13px;font-weight:600;flex:1;min-width:0;
                overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #chartHead .sub{color:var(--dim);font-weight:400}
  #chartHead a{flex:none;font-size:12px;color:var(--accent);text-decoration:none}
  #chartHead a:hover{text-decoration:underline}
  #chartHead button{flex:none;border:0;background:none;cursor:pointer;color:var(--dim);
                    font-size:17px;line-height:1;padding:0 2px}
  #chartFrame{flex:1;width:100%;border:0;background:#525659}
</style>

<body>

<aside id="side">
  <h1>全球机场分布<small>OurAirports 数据集 · 85,860 个机场</small></h1>
  <div id="scroll">
    <div class="grp"><label class="t">机场类型</label><div id="fType"></div></div>
    <div class="grp"><label class="t">属性</label>
      <label class="row"><input type="checkbox" id="fSched"><span class="n">仅有定期航班</span></label>
      <label class="row"><input type="checkbox" id="fHard"><span class="n">仅硬质道面</span></label>
      <label class="row"><input type="checkbox" id="fClosed"><span class="n">显示已关闭机场</span>
        <span class="c" id="closedNote"></span></label>
    </div>
    <div class="grp"><label class="t">最长跑道 ≥ <span id="lenTxt">0 ft</span></label>
      <input type="range" id="fLen" min="0" max="16000" step="500" value="0">
    </div>
    <div class="grp"><label class="t">国家 / 地区</label>
      <select id="fCty"><option value="-1">全部</option></select>
    </div>
    <div class="grp"><label class="t">底图</label>
      <select id="fBase">
        <option value="auto">自动</option>
        <option value="offline">离线</option>
        <option value="online">在线</option>
      </select>
      <label class="row" style="margin-top:7px"><input type="checkbox" id="fHill">
        <span class="n">山体阴影（DEM）</span><span class="c" id="hillNote"></span></label>
      <label class="row" style="margin-top:7px"><input type="checkbox" id="fBldg3d">
        <span class="n">3D 建筑</span><span class="c" id="bldgNote"></span></label>
      <div class="hint" id="baseHint"></div>
    </div>
    <div class="grp"><label class="t">实时航班</label>
      <label class="row"><input type="checkbox" id="fFlights">
        <span class="n">显示空中航班</span><span class="c" id="flightCount"></span></label>
      <div class="hint" id="flightHint"></div>
    </div>
  </div>
  <div id="count"></div>
</aside>

<div id="wrap">
  <div id="map"></div>
  <div id="boot">正在载入 8.6 万个机场…</div>
  <div id="search">
    <input type="search" id="q" placeholder="搜索 ICAO / IATA / 名称 / 城市" autocomplete="off">
    <div id="results"></div>
  </div>
  <div id="tip"></div>
  <div id="note">数据 <a href="https://ourairports.com/" target="_blank" rel="noopener">OurAirports</a>
    · 底图 <span id="baseAttrib"></span></div>

  <section id="detail">
    <div id="dhead"><h2 id="dName"></h2><div class="sub" id="dSub"></div>
      <button id="close" title="关闭">✕</button></div>
    <div id="dbody"></div>
  </section>
</div>

<div id="chart">
  <div id="chartBox">
    <div id="chartHead"><h4 id="chartTitle"></h4>
      <a id="chartOpen" target="_blank" rel="noopener">新窗口打开</a>
      <button id="chartClose" title="关闭">✕</button></div>
    <iframe id="chartFrame" title="航图"></iframe>
  </div>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script src="data/meta.js"></script>
<script src="data/airports.js"></script>
<script src="data/details.js"></script>
<script src="data/basemap.js"></script>
<script src="vendor/glyphs.js"></script>
<script src="vendor/pmtiles.js"></script>
<script>
(function(){
"use strict";

// ---------- 列索引（对应 META.cols） ----------
var ID=0, IDENT=1, NAME=2, TYPE=3, RANK=4, LON=5, LAT=6, ELEV=7,
    CTY=8, RGN=9, MUNI=10, IATA=11, SCHED=12, RWLEN=13, HARD=14;

var TYPE_ZH  = ["大型机场","中型机场","小型机场","直升机坪","水上机场","热气球场","已关闭"];
var TYPE_COL = ["#e4572e","#f2a541","#2e9e8f","#8b5fbf","#3d9bd6","#d1568f","#98a2b3"];
var STYLE_URL = "https://tiles.openfreemap.org/styles/positron";

var rows = window.AP, DT = window.DT, M = window.META;
var closedRows = null, closedLoading = false;
var map = null, ready = false, offline = false;

// 搜索索引：小写检索串建一次复用。已关闭机场载入后会追加进来。
var searchRows = [], hay = [];
function indexSearch(list){
  for (var i=0;i<list.length;i++){
    var r = list[i];
    searchRows.push(r);
    hay.push((r[IDENT]+" "+(r[IATA]||"")+" "+r[NAME]+" "+(r[MUNI]||"")).toLowerCase());
  }
}
indexSearch(rows);

// ---------- 工具 ----------
function el(tag, cls, text){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;   // 一律 textContent，不用 innerHTML
  return n;
}
function fmt(n){ return n==null ? "—" : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function ftm(ft){ return ft==null ? "—" : fmt(ft)+" ft / "+fmt(Math.round(ft*0.3048))+" m"; }
function ctyName(i){ return M.ctyNames[i] || M.ctyCodes[i] || "—"; }
function rgnName(i){ return M.rgnNames[i] || M.rgnCodes[i] || "—"; }

// Web Mercator 在 ±85.051° 外趋于无穷，2 个南极点位若不钳制会被瓦片裁剪静默丢失。
// 这里只钳制用于渲染的几何，详情面板读的是原始行，显示的仍是真实坐标。
var MERC_LIM = 85.05112;
function toFeature(r){
  var lat = r[LAT] > MERC_LIM ? MERC_LIM : (r[LAT] < -MERC_LIM ? -MERC_LIM : r[LAT]);
  return { type:"Feature", id:r[ID],
    geometry:{ type:"Point", coordinates:[r[LON], lat] },
    properties:{ id:r[ID], rank:r[RANK], type:r[TYPE], sched:r[SCHED],
                 hard:r[HARD], rwlen:r[RWLEN]||0, cty:r[CTY],
                 label:r[IATA] || r[IDENT] } };
}
function toFC(list){
  var f = new Array(list.length);
  for (var i=0;i<list.length;i++) f[i] = toFeature(list[i]);
  return { type:"FeatureCollection", features:f };
}

// ---------- 筛选状态 ----------
var F = { types:[0,1,2,3,4,5], sched:false, hard:false, len:0, cty:-1, closed:false };

// zoom 分级：z<4 只见大型机场；z≥4 加中型与有定期航班的；z≥7 加小型；z≥10 加直升机坪等
var ZOOM_GATE = ["<=", ["get","rank"], ["step", ["zoom"], 0, 4,1, 7,2, 10,3]];

function buildFilter(forClosed){
  var f = ["all"];
  if (!forClosed) f.push(ZOOM_GATE);
  f.push(["in", ["get","type"], ["literal", F.types]]);
  if (F.sched) f.push(["==", ["get","sched"], 1]);
  if (F.hard)  f.push(["==", ["get","hard"], 1]);
  if (F.len>0) f.push([">=", ["get","rwlen"], F.len]);
  if (F.cty>=0) f.push(["==", ["get","cty"], F.cty]);
  return f;
}
// JS 侧同款谓词，仅用于计数与搜索（不含 zoom 分级）
function matches(r){
  if (F.types.indexOf(r[TYPE]) < 0) return false;
  if (F.sched && !r[SCHED]) return false;
  if (F.hard  && !r[HARD])  return false;
  if (F.len>0 && !(r[RWLEN] >= F.len)) return false;
  if (F.cty>=0 && r[CTY] !== F.cty) return false;
  return true;
}

// ---------- 地图 ----------
function circlePaint(){
  var col = ["match", ["get","type"]].concat(
      TYPE_COL.slice(0,6).reduce(function(a,c,i){ return a.concat([i,c]); }, []),
      ["#98a2b3"]);
  return {
    "circle-color": col,
    "circle-stroke-color": "#ffffff",
    "circle-stroke-width": ["interpolate",["linear"],["zoom"], 3,0.5, 10,1.2],
    "circle-opacity": 0.9,
    "circle-radius": ["interpolate",["linear"],["zoom"],
      2,  ["match",["get","rank"], 0,3.4, 1,2.2, 2,1.7, 1.5],
      6,  ["match",["get","rank"], 0,6.0, 1,4.0, 2,2.7, 2.3],
      10, ["match",["get","rank"], 0,9.5, 1,7.0, 2,4.6, 4.0],
      14, ["match",["get","rank"], 0,15.0,1,11.5,2,7.5, 6.5]]
  };
}

function addAirportLayers(){
  map.addSource("ap", { type:"geojson", data:toFC(rows) });
  map.addLayer({ id:"ap", type:"circle", source:"ap",
                 filter:buildFilter(false), paint:circlePaint() });

  // 离线底图自带本地字形，标注层两种模式下都能用
  {
    map.addLayer({ id:"ap-label", type:"symbol", source:"ap", minzoom:7,
      filter:buildFilter(false),
      layout:{ "text-field":["get","label"],
               "text-font":["Noto Sans Regular"],
               "text-size":["interpolate",["linear"],["zoom"], 7,10, 12,12.5],
               "text-offset":[0,1.0], "text-anchor":"top",
               "text-allow-overlap":false, "text-optional":true,
               "symbol-sort-key":["get","rank"] },
      paint:{ "text-color":"#39414d", "text-halo-color":"#fff", "text-halo-width":1.4 } });
  }
  if (closedRows) addClosedLayer();   // 切换底图样式后重新挂载
}

// 已关闭机场图层：抽出来复用，切换底图样式时需要重建
function addClosedLayer(){
  if (map.getSource("closed")) return;
  map.addSource("closed", { type:"geojson", data:toFC(closedRows) });
  map.addLayer({ id:"closed", type:"circle", source:"closed",
                 filter:buildFilter(true), minzoom:6,
                 layout:{ visibility: F.closed ? "visible" : "none" },
                 paint:{ "circle-color":"rgba(0,0,0,0)", "circle-stroke-color":"#98a2b3",
                         "circle-stroke-width":1.1,
                         "circle-radius":["interpolate",["linear"],["zoom"], 6,1.8, 10,3.4, 14,5.5] } }, "ap");
  bindLayer("closed");
}

// MapLibre 的图层级监听注册在 map 上、按图层名在派发时匹配，setStyle 不会清除它们，
// 所以只能绑一次，否则每次切换底图都会叠加一层重复监听。
var bound = {};
function bindLayer(layer){
  if (bound[layer]) return;
  bound[layer] = 1;
  var tip = document.getElementById("tip");
  {
    map.on("mousemove", layer, function(e){
      map.getCanvas().style.cursor = "pointer";
      var p = e.features[0].properties, r = rowById(p.id);
      if (!r) return;
      tip.textContent = r[NAME] + (r[IATA] ? "  ("+r[IATA]+")" : "");
      tip.style.display = "block";
      tip.style.left = e.point.x + "px";
      tip.style.top  = e.point.y + "px";
    });
    map.on("mouseleave", layer, function(){
      map.getCanvas().style.cursor = "";
      tip.style.display = "none";
    });
    map.on("click", layer, function(e){
      showDetail(e.features[0].properties.id);
    });
  }
}
function bindMapEvents(){
  bindLayer("ap");
  initFlightsUI();
  map.on("click", function(e){
    var layers = map.getLayer("closed") ? ["ap","closed"] : ["ap"];
    if (!map.queryRenderedFeatures(e.point, {layers:layers}).length) hideDetail();
  });
}

// id -> row 查表
var byId = {};
function indexRows(list){ for (var i=0;i<list.length;i++) byId[list[i][ID]] = list[i]; }
indexRows(rows);
function rowById(id){ return byId[id]; }

function refresh(){
  if (!ready) return;
  map.setFilter("ap", buildFilter(false));
  if (map.getLayer("ap-label")) map.setFilter("ap-label", buildFilter(false));
  if (map.getLayer("closed"))  map.setFilter("closed", buildFilter(true));

  var n = 0;
  for (var i=0;i<rows.length;i++) if (matches(rows[i])) n++;
  if (F.closed && closedRows) for (var j=0;j<closedRows.length;j++) if (matches(closedRows[j])) n++;
  var total = rows.length + (F.closed && closedRows ? closedRows.length : 0);
  document.getElementById("count").innerHTML = "";
  document.getElementById("count").append(
    "符合筛选 ", el("b", null, fmt(n)), " / " + fmt(total) + " 个机场");
}

// ---------- 已关闭机场：按需加载 ----------
function toggleClosed(on){
  F.closed = on;
  if (!on){ if (map.getLayer("closed")) map.setLayoutProperty("closed","visibility","none"); refresh(); return; }
  if (closedRows){
    if (!map.getLayer("closed")) addClosedLayer();
    map.setLayoutProperty("closed","visibility","visible"); refresh(); return;
  }
  if (closedLoading) return;
  closedLoading = true;
  document.getElementById("closedNote").textContent = "载入中…";
  var s = document.createElement("script");   // 动态 script 注入，file:// 下同样可用
  s.src = "data/closed.js";
  s.onload = function(){
    closedRows = window.CLOSED; indexRows(closedRows); indexSearch(closedRows);
    addClosedLayer();
    document.getElementById("closedNote").textContent = fmt(closedRows.length);
    closedLoading = false;
    refresh();
  };
  s.onerror = function(){
    document.getElementById("closedNote").textContent = "载入失败";
    closedLoading = false;
  };
  document.head.appendChild(s);
}

// ---------- FAA 航图（美国及其属地）----------
// 美国的 d-TPP 航图是公开直链：PDF 无需登录，响应头里既没有 X-Frame-Options 也没有
// CSP，所以能直接 iframe 嵌进页面看。别处只能给外链——ChartFox 自己带着
// X-Frame-Options: SAMEORIGIN，跨源嵌不进来。
// 索引由 build_faa.py 生成（约 750 KB），首次打开机场详情时按需注入，不进首屏。
// 覆盖范围以索引里有没有为准，不按国家判断：d-TPP 除美国本土外还带着波多黎各、
// 关岛这些属地，以及密克罗尼西亚、马绍尔、帕劳这三个自由联合邦——硬编码辖区
// 清单迟早会漏，索引本身才是权威。
var faa = null, faaLoading = false, faaQueue = [], curDetail = null;

function faaUrl(pdf){ return "https://aeronav.faa.gov/d-tpp/" + faa.cycle + "/" + pdf + ".PDF"; }
// FAA 只把最近三个周期留在服务器上，过期的会 404，所以到期要提示用户重跑构建脚本
function faaStale(){ return !!faa.to && new Date().toISOString().slice(0,10) >= faa.to; }

function loadFaa(cb){
  if (faa){ cb(); return; }
  faaQueue.push(cb);
  if (faaLoading) return;
  faaLoading = true;
  var s = document.createElement("script");   // 同 closed.js：动态注入，file:// 下也能用
  s.src = "data/faa.js";
  function done(){
    faa = window.FAA || { ap:{}, groups:[] };  // 取不到就当没有，自动退回 ChartFox 外链
    faaLoading = false;
    var q = faaQueue; faaQueue = [];
    for (var i=0;i<q.length;i++) q[i]();
  }
  s.onload = done; s.onerror = done;
  document.head.appendChild(s);
}

// 航图区内容。索引是懒加载的，所以做成可重入：先占位，数据到了再填一次。
function fillCharts(box, r, icao){
  box.innerHTML = "";
  if (icao){
    if (!faa){
      box.append(el("div","empty","载入航图索引…"));
      var want = curDetail;
      loadFaa(function(){ if (curDetail === want) fillCharts(box, r, icao); });
      return;
    }
    var lst = faa.ap[icao];
    if (lst && lst.length){ faaCharts(box, icao, lst); return; }
  }
  // d-TPP 里没有这个场：退回 ChartFox 外链
  if (icao && r[TYPE] <= 1){
    var lk = el("div","lnk");
    lk.append(link("在 ChartFox 查看", "https://chartfox.org/" + icao));
    box.append(lk);
  } else {
    box.append(el("div","empty","无航图"));
  }
}

function faaCharts(box, icao, lst){
  var groups = faa.groups || [], byG = {};
  for (var i=0;i<lst.length;i++){
    var g = lst[i][0];
    (byG[g] = byG[g] || []).push(lst[i]);
  }
  for (var g=0; g<groups.length; g++){
    if (!byG[g]) continue;
    var sec = el("div","cgrp");
    sec.append(el("b", null, groups[g]));
    byG[g].forEach(function(c){
      var a = el("a", null, c[1]);
      a.href = faaUrl(c[2]);                    // 真实 href：中键/右键另存也能用
      a.addEventListener("click", function(e){ e.preventDefault(); openChart(icao, c[1], c[2]); });
      sec.append(a);
    });
    box.append(sec);
  }
  if (faaStale())
    box.append(el("div","hint","AIRAC 周期 " + faa.cycle + " 已于 " + faa.to +
                               " 过期，FAA 可能已下架这些图。重跑 build_faa.py 更新。"));
}

function openChart(icao, name, pdf){
  var url = faaUrl(pdf), t = document.getElementById("chartTitle");
  t.innerHTML = "";
  t.append(icao + "  ", el("span","sub", name));
  document.getElementById("chartOpen").href = url;
  document.getElementById("chartFrame").src = url;
  document.getElementById("chart").classList.add("on");
}
function closeChart(){
  document.getElementById("chart").classList.remove("on");
  document.getElementById("chartFrame").src = "about:blank";   // 停掉 PDF 阅读器，别让它在后台占着
}

// ---------- 详情面板 ----------
// ident 是 OurAirports 的主键，未必是 ICAO 代码：d.c 存的就是两者不一致时的真实 ICAO
// （全库 784 条），没有 d.c 时才回退到 ident，且 ident 得是 4 位字母才算数——小型场和
// 直升机坪大量使用 US-0001 这类伪码，不能当 ICAO 用。
function icaoOf(r, d){
  return d.c || (/^[A-Z]{4}$/.test(r[IDENT]) ? r[IDENT] : "");
}

function showDetail(id){
  var r = rowById(id); if (!r) return;
  var d = DT[id] || {};
  curDetail = id;                    // 航图索引是异步到的，回填前要确认面板还停在同一个机场

  document.getElementById("dName").textContent = r[NAME];
  var sub = document.getElementById("dSub");
  sub.innerHTML = "";
  var b = el("span","badge", TYPE_ZH[r[TYPE]]);
  b.style.background = TYPE_COL[r[TYPE]];
  sub.append(b, " ", r[IDENT] + (r[IATA] ? " · " + r[IATA] : ""));
  if (r[SCHED]) sub.append(" · 有定期航班");

  var body = document.getElementById("dbody");
  body.innerHTML = "";

  // 基本信息
  var dl = el("dl");
  function kv(k,v){ dl.append(el("dt",null,k), el("dd",null,v)); }
  kv("国家", ctyName(r[CTY]));
  kv("地区", rgnName(r[RGN]));
  if (r[MUNI]) kv("城市", r[MUNI]);
  kv("坐标", r[LAT].toFixed(5) + ", " + r[LON].toFixed(5));
  kv("海拔", r[ELEV]==null ? "—" : ftm(r[ELEV]));
  kv("ICAO", icaoOf(r, d) || "—");
  if (r[IATA]) kv("IATA", r[IATA]);
  if (d.g) kv("GPS", d.g === 1 ? r[IDENT] : d.g);
  if (d.l) kv("本地代码", d.l === 1 ? r[IDENT] : d.l);
  body.append(sect("基本信息", dl));

  // 跑道
  if (d.r && d.r.length){
    var t = el("table");
    t.append(trh(["跑道","长 × 宽 (ft)","道面","灯光"]));
    d.r.forEach(function(rw){
      var tr = el("tr");
      var name = (rw[0]||"?") + "/" + (rw[1]||"?") + (rw[7] ? " (已关闭)" : "");
      var size = (rw[2]==null?"—":fmt(rw[2])) + " × " + (rw[3]==null?"—":fmt(rw[3]));
      var surf = M.surfaceZh[M.surfaces[rw[4]]];
      if (rw[5] && rw[5].toUpperCase() !== M.surfaces[rw[4]].toUpperCase()) surf += "（" + rw[5] + "）";
      tr.append(el("td",null,name), el("td","n",size), el("td",null,surf), el("td",null, rw[6]?"有":"—"));
      if (rw[7]) tr.style.opacity = ".55";
      t.append(tr);
    });
    body.append(sect("跑道 · " + d.r.length + " 条", t));
  } else {
    body.append(sect("跑道", el("div","empty","该机场无跑道记录")));
  }

  // 通信频率
  if (d.f && d.f.length){
    var tf = el("table");
    tf.append(trh(["类型","说明","频率 (MHz)"]));
    d.f.forEach(function(fq){
      var tr = el("tr");
      tr.append(el("td",null,fq[0]||"—"), el("td",null,fq[1]||"—"), el("td","n",fq[2]||"—"));
      tf.append(tr);
    });
    body.append(sect("通信频率 · " + d.f.length + " 条", tf));
  } else {
    body.append(sect("通信频率", el("div","empty","该机场无频率记录")));
  }

  // 外链
  var links = el("div","lnk");
  if (d.w) links.append(link("维基百科", M.wikiPrefix + d.w));
  if (d.W) links.append(link("维基百科", d.W));
  if (d.h) links.append(link("官方网站", d.h));
  body.append(sect("外部链接", links.childNodes.length ? links : el("div","empty","无外部链接")));

  // 航图：d-TPP 里有的直接内嵌看，其余给 ChartFox 外链。ChartFox 的深链只认 4 位
  // 字母且不校验机场是否存在（传错代码不 404，会静默跳到空页），所以必须走 icaoOf
  // 拿真实 ICAO，不能用裸 ident。
  var icao = icaoOf(r, d), cbox = el("div");
  fillCharts(cbox, r, icao);
  body.append(sect("航图", cbox));

  document.getElementById("detail").classList.add("on");
}
function sect(title, node){
  var s = el("section","sec"); s.append(el("h3",null,title), node); return s;
}
function trh(cols){
  var tr = el("tr"); cols.forEach(function(c){ tr.append(el("th",null,c)); }); return tr;
}
function link(text, href){
  var a = el("a",null,text); a.href = href; a.target = "_blank"; a.rel = "noopener"; return a;
}
function hideDetail(){
  document.getElementById("detail").classList.remove("on");
}

// ---------- 搜索 ----------
var qBox = document.getElementById("q"), resBox = document.getElementById("results"), qTimer;
qBox.addEventListener("input", function(){
  clearTimeout(qTimer);
  qTimer = setTimeout(runSearch, 120);
});
function runSearch(){
  var q = qBox.value.trim().toLowerCase();
  resBox.innerHTML = "";
  if (q.length < 2){ resBox.classList.remove("on"); return; }
  var pre = [], sub = [];
  for (var i=0;i<searchRows.length && pre.length < 20;i++){
    var row = searchRows[i];
    if (row[TYPE] === 6 && !F.closed) continue;   // 未开启"显示已关闭"就不搜它们
    if (!matches(row)) continue;
    var p = hay[i].indexOf(q);
    if (p === 0) pre.push(row);
    else if (p > 0 && sub.length < 40) sub.push(row);
  }
  var hits = pre.concat(sub).slice(0,20);
  if (!hits.length){
    resBox.append(el("div","hit","无匹配结果"));
  } else {
    hits.forEach(function(r){
      var h = el("div","hit");
      h.append(el("b",null, r[NAME]),
               el("span",null, [r[IDENT], r[IATA], r[MUNI], ctyName(r[CTY])]
                                 .filter(Boolean).join(" · ")));
      h.addEventListener("click", function(){
        map.flyTo({ center:[r[LON], r[LAT]], zoom:Math.max(map.getZoom(), 11), speed:1.4 });
        showDetail(r[ID]);
        resBox.classList.remove("on");
      });
      resBox.append(h);
    });
  }
  resBox.classList.add("on");
}
document.addEventListener("click", function(e){
  if (!document.getElementById("search").contains(e.target)) resBox.classList.remove("on");
});

// ---------- 筛选 UI ----------
(function buildUI(){
  var box = document.getElementById("fType");
  var counts = new Array(7).fill(0);
  for (var i=0;i<rows.length;i++) counts[rows[i][TYPE]]++;

  for (var t=0;t<6;t++){
    (function(t){
      var lab = el("label","row");
      var cb = document.createElement("input"); cb.type="checkbox"; cb.checked=true;
      var sw = el("span","sw"); sw.style.background = TYPE_COL[t];
      lab.append(cb, sw, el("span","n",TYPE_ZH[t]), el("span","c",fmt(counts[t])));
      cb.addEventListener("change", function(){
        F.types = F.types.filter(function(x){ return x!==t; });
        if (cb.checked) F.types.push(t);
        F.types.push(6);                                  // closed 图层独立控制
        F.types = F.types.filter(function(x,i,a){ return a.indexOf(x)===i; });
        refresh();
      });
      box.append(lab);
    })(t);
  }
  F.types.push(6);

  document.getElementById("fSched").addEventListener("change", function(){
    F.sched = this.checked; refresh(); });
  document.getElementById("fHard").addEventListener("change", function(){
    F.hard = this.checked; refresh(); });
  document.getElementById("fClosed").addEventListener("change", function(){
    toggleClosed(this.checked); });

  var len = document.getElementById("fLen"), lenTxt = document.getElementById("lenTxt");
  len.addEventListener("input", function(){
    F.len = +len.value;
    lenTxt.textContent = F.len ? fmt(F.len)+" ft" : "0 ft";
    refresh();
  });

  // 国家下拉：只列出实际有机场的，按机场数降序
  var used = {};
  for (var k=0;k<rows.length;k++) used[rows[k][CTY]] = (used[rows[k][CTY]]||0)+1;
  var sel = document.getElementById("fCty");
  Object.keys(used).map(Number).sort(function(a,b){ return used[b]-used[a]; })
    .forEach(function(ci){
      var o = document.createElement("option");
      o.value = ci; o.textContent = ctyName(ci) + "  (" + fmt(used[ci]) + ")";
      sel.append(o);
    });
  sel.addEventListener("change", function(){ F.cty = +sel.value; refresh(); });
})();

// ---------- 离线字形 ----------
// MapLibre 取字形走 AJAX，file:// 下会被浏览器阻止，所以注册自定义协议，
// 直接把 vendor/glyphs.js 里内嵌的 base64 字形喂给它。
var GLYPH_URL = "localglyphs://glyphs/{fontstack}/{range}.pbf";
(function registerGlyphs(){
  if (!window.GLYPHS || !maplibregl.addProtocol) return;
  maplibregl.addProtocol("localglyphs", function(params){
    var m = /glyphs\/([^/]+)\/([^/]+)\.pbf/.exec(params.url);
    var stack = m ? decodeURIComponent(m[1]) : "", range = m ? m[2] : "";
    var b64 = (window.GLYPHS[stack] || {})[range];
    if (!b64) return Promise.resolve({ data: new ArrayBuffer(0) });   // 该区段无字形，静默留空
    var bin = atob(b64), buf = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
    return Promise.resolve({ data: buf.buffer });
  });
})();

// ---------- 离线底图样式（本地 Natural Earth 数据） ----------
var C = { void:"#e8edf1", land:"#f6f7f8", water:"#dde5ec",
          border:"#cfd6dd", state:"#e4e8ec", label:"#7b8794" };
function offlineStyle(){
  var B = window.BASEMAP || {};
  var src = {}, layers = [{ id:"bg", type:"background", paint:{ "background-color":C.void } }];
  function add(key, layer){ if (B[key]) { src[key] = { type:"geojson", data:B[key] }; layers.push(layer); } }

  add("countries", { id:"land", type:"fill", source:"countries",
                     paint:{ "fill-color":C.land } });
  add("lakes",     { id:"lakes", type:"fill", source:"lakes",
                     paint:{ "fill-color":C.water } });
  add("rivers",    { id:"rivers", type:"line", source:"rivers", minzoom:3,
                     paint:{ "line-color":C.water,
                             "line-width":["interpolate",["linear"],["zoom"], 3,0.4, 10,1.6] } });
  add("states",    { id:"states", type:"line", source:"states", minzoom:4,
                     paint:{ "line-color":C.state, "line-width":0.7 } });
  if (B.countries) layers.push({ id:"borders", type:"line", source:"countries",
                     paint:{ "line-color":C.border,
                             "line-width":["interpolate",["linear"],["zoom"], 1,0.5, 8,1.4] } });
  add("places",    { id:"places", type:"symbol", source:"places", minzoom:3,
                     filter:["<=", ["get","r"], ["step",["zoom"], 1, 4,3, 6,5, 8,7]],
                     layout:{ "text-field":["get","name"], "text-font":["Noto Sans Regular"],
                              "text-size":["interpolate",["linear"],["zoom"], 3,10, 9,13],
                              "symbol-sort-key":["get","r"] },
                     paint:{ "text-color":C.label, "text-halo-color":C.land, "text-halo-width":1.2 } });
  return { version:8, glyphs:GLYPH_URL, sources:src, layers:layers };
}

// ---------- Protomaps 离线矢量底图 ----------
// schema 与 OpenMapTiles 完全不同，样式不能复用。以下 kind / kind_detail 取值由真实
// 瓦片解码统计得来（浦东机场、上海市中心、JFK、弗吉尼亚乡村、苏黎世、巴黎、低缩放大区
// 各采一次）：
//   roads.kind        highway / major_road / medium_road / minor_road / path / rail /
//                     aeroway / ferry / aerialway / other
//   roads.kind_detail motorway / trunk / primary / secondary / tertiary / residential /
//                     service / footway / steps / runway / taxiway / subway ...
//   roads 另有 is_bridge / is_tunnel / is_link：置位时为 boolean true，否则字段缺失，
//                     所以「非桥非隧」要写成 != true（缺失取 null，null != true 成立）
//   water.kind        面：ocean/lake/water/bay/basin/fountain/swimming_pool
//                     线：river/canal/stream —— 两者混在同一层，见 water 图层的注释
//   landuse.kind      park/forest/grass/farmland/... 另有 aerodrome/airfield/runway
//   places.kind       locality / macrohood / neighbourhood / region / country
//   boundaries        kind=country/region/county/locality，kind_detail 是行政级别数字
//   pois / places     带 min_zoom 字段，是 Protomaps 自己算好的要素重要度，直接拿来
//                     控制标注密度，比按图层一刀切 minzoom 效果好得多
var PM = {
  paper:"#f4f1ec", earth:"#faf8f5",
  water:"#c9dced", waterInk:"#5d87a3",
  green:"#e3ebdd", park:"#d9e8d1", wood:"#d5e2cc", sand:"#f0e8d6",
  wet:"#dbe6e1", ice:"#eef4f8",
  built:"#efece7", inst:"#eae6de", sport:"#dfead9", grave:"#e1e7db",
  road:"#ffffff", roadCase:"#e0dbd3",
  major:"#fdf6e3", majorCase:"#e8ddc0",
  motor:"#fbe6bf", motorCase:"#dfbe83",
  rail:"#dcd6cc", railCase:"#c6bfb3",
  aero:"#e8e6ef", aeroCase:"#cfccdd", apron:"#efeef4",
  bldg:"#e6e1da", bldgCase:"#d8d2c9",
  bound:"#c3bcb2", ink:"#48423a", dim:"#7b7367", poi:"#8b8173", halo:"#ffffff"
};

// 底图标注的名称字段：优先中文，回落到通用名与英文。
// 注意不能叫 NAME —— 顶部的列索引常量已占用该名字，同一 IIFE 作用域里会互相覆盖。
var PM_NAME = ["coalesce", ["get","name:zh-Hans"], ["get","name"], ["get","name:en"]];

// 本地只内嵌了 Noto Sans Regular（拉丁 0-255，无粗体），CJK 交给
// localIdeographFontFamily 在客户端渲染。所以标注层级只能靠字号、颜色、光晕区分，
// 不能用字重。
var PM_FONT = ["Noto Sans Regular"];

function protomapsStyle(url, maxzoom){
  var src = { pm: { type:"vector", url:"pmtiles://" + url, attribution:
                    "<a href=\"https://protomaps.com\">Protomaps</a> © <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap</a>" } };
  var L = [];
  function add(o){ L.push(o); }
  function kindIn(list){ return ["in", ["get","kind"], ["literal", list]]; }
  function detailIn(list){ return ["in", ["get","kind_detail"], ["literal", list]]; }
  // 面层：kind 命中即可
  function fill(id, kinds, color, opts){
    var o = { id:id, type:"fill", source:"pm", "source-layer":(opts&&opts.sl)||"landuse",
              filter:kindIn(kinds), paint:{ "fill-color":color } };
    if (opts && opts.minzoom) o.minzoom = opts.minzoom;
    if (opts && opts.opacity != null) o.paint["fill-opacity"] = opts.opacity;
    add(o);
  }
  // 线宽插值：把 [z,w, z,w, ...] 展开成 interpolate 表达式
  function w(){
    var e = ["interpolate", ["exponential", 1.5], ["zoom"]];
    for (var i = 0; i < arguments.length; i++) e.push(arguments[i]);
    return e;
  }

  // ===== 底 =====
  add({ id:"bg", type:"background", paint:{ "background-color":PM.paper } });
  add({ id:"earth", type:"fill", source:"pm", "source-layer":"earth",
        filter:["==", ["get","kind"], "earth"], paint:{ "fill-color":PM.earth } });
  add({ id:"landcover", type:"fill", source:"pm", "source-layer":"landcover", maxzoom:8,
        paint:{ "fill-color":["match", ["get","kind"],
                  "forest", PM.wood, "grassland", PM.green, "farmland", PM.green,
                  "glacier", PM.ice, "barren", PM.sand, PM.green],
                "fill-opacity":0.55 } });

  // ===== 土地利用 =====
  fill("lu-wood",   ["forest","wood","scrub"], PM.wood, {minzoom:6});
  fill("lu-grass",  ["grass","meadow","grassland","farmland","allotments",
                     "village_green","orchard","vineyard","farmyard"], PM.green, {minzoom:6});
  fill("lu-park",   ["park","garden","nature_reserve","recreation_ground",
                     "dog_park","national_park","protected_area"], PM.park, {minzoom:5});
  fill("lu-sand",   ["sand","beach","bare_rock","barren","quarry"], PM.sand, {minzoom:9});
  fill("lu-glacier",["glacier"], PM.ice, {minzoom:5});
  fill("lu-wetland",["wetland"], PM.wet, {minzoom:8});
  fill("lu-built",  ["residential","commercial","industrial","retail","railway",
                     "military","pedestrian","platform","other"], PM.built,
                    {minzoom:10, opacity:0.7});
  fill("lu-inst",   ["school","college","university","hospital","kindergarten"], PM.inst, {minzoom:11});
  fill("lu-sport",  ["pitch","playground","golf_course","zoo","theme_park","stadium"], PM.sport, {minzoom:12});
  fill("lu-grave",  ["cemetery"], PM.grave, {minzoom:11});
  // 机场用地：整片场区比普通工业用地更该被看见，单列一层并给描边
  fill("lu-aerodrome", ["aerodrome","airfield"], PM.aero, {minzoom:9});
  add({ id:"lu-aerodrome-case", type:"line", source:"pm", "source-layer":"landuse", minzoom:10,
        filter:kindIn(["aerodrome","airfield"]),
        paint:{ "line-color":PM.aeroCase, "line-width":w(10,0.5, 14,1.2) } });

  // ===== 水 =====
  // 必须按几何类型过滤：Protomaps 的 water 层把水域面和河道线混在一起（上海一带
  // 631 个要素里 596 个是 river/canal 的线）。fill 层拿到 LineString 会把折线首尾
  // 相连当成环去填充，于是沿着河谷糊出大片假水面。geometry-type 对 MultiPolygon
  // 也返回 "Polygon"，实测过，不会漏掉多部件水域。
  add({ id:"water", type:"fill", source:"pm", "source-layer":"water",
        filter:["==", ["geometry-type"], "Polygon"],
        paint:{ "fill-color":PM.water } });
  add({ id:"waterway", type:"line", source:"pm", "source-layer":"water", minzoom:9,
        filter:["all", ["==", ["geometry-type"], "LineString"],
                       kindIn(["river","canal","stream","ditch"])],
        paint:{ "line-color":PM.water,
                "line-width":w(9,0.5, 12,1.2, 15,3, 18,7) } });

  // ===== 机场道面（在道路之下，让公路压在跑道上而不是相反）=====
  fill("aero-runway-area", ["runway"], PM.apron, {minzoom:11, sl:"landuse"});
  add({ id:"pier", type:"line", source:"pm", "source-layer":"roads", minzoom:13,
        filter:detailIn(["pier"]),
        paint:{ "line-color":PM.earth, "line-width":w(13,1, 18,6) } });

  // ===== 道路 =====
  // 分级表：[后缀, kind_detail 列表, 填充色, 描边色, 起始缩放, 宽度档位]
  // 所有 casing 先画完再画所有 fill，否则高等级道路的描边会切断低等级道路的路面。
  var ROADS = [
    ["service",  ["service","alley","driveway","parking_aisle","emergency_access"],
                 PM.road, PM.roadCase, 14, [14,0.8, 16,2.4, 18,6]],
    ["minor",    ["residential","unclassified","living_street","raceway"],
                 PM.road, PM.roadCase, 12, [12,0.7, 15,3, 18,11]],
    ["tertiary", ["tertiary","tertiary_link"],
                 PM.road, PM.roadCase, 10, [10,0.8, 14,3.4, 18,14]],
    ["secondary",["secondary","secondary_link"],
                 PM.road, PM.roadCase, 9,  [9,0.9, 13,3.4, 18,18]],
    ["primary",  ["primary","primary_link"],
                 PM.major, PM.majorCase, 7, [7,0.9, 12,3.4, 18,22]],
    ["trunk",    ["trunk","trunk_link"],
                 PM.major, PM.majorCase, 6, [6,0.9, 12,4, 18,24]],
    ["motorway", ["motorway","motorway_link"],
                 PM.motor, PM.motorCase, 5, [5,1, 10,3, 14,9, 18,28]]
  ];
  var notBridge = ["!=", ["get","is_bridge"], true];
  var i, r;
  // 隧道：虚线描边、不画路面，压在地面道路之下
  add({ id:"tunnel", type:"line", source:"pm", "source-layer":"roads", minzoom:12,
        filter:["all", ["==", ["get","is_tunnel"], true],
                       detailIn(["motorway","trunk","primary","secondary","tertiary",
                                 "residential","unclassified","motorway_link"])],
        layout:{ "line-cap":"butt" },
        paint:{ "line-color":PM.roadCase, "line-dasharray":[3,2],
                "line-width":w(12,1.2, 16,5, 18,10) } });
  // 步道
  add({ id:"road-path", type:"line", source:"pm", "source-layer":"roads", minzoom:14,
        filter:["all", ["==", ["get","kind"], "path"],
                       ["!", detailIn(["pier"])]],
        layout:{ "line-cap":"round", "line-join":"round" },
        paint:{ "line-color":"#e9e4db", "line-dasharray":[2,1.5],
                "line-width":w(14,0.7, 18,2.6) } });
  // casing
  for (i = 0; i < ROADS.length; i++){
    r = ROADS[i];
    add({ id:"road-"+r[0]+"-case", type:"line", source:"pm", "source-layer":"roads",
          minzoom:r[4], filter:["all", notBridge, detailIn(r[1])],
          layout:{ "line-cap":"round", "line-join":"round" },
          paint:{ "line-color":r[3], "line-width":w.apply(null, r[5].map(function(v,k){
                    return k % 2 ? +(v * 1.3 + 0.7).toFixed(2) : v; })) } });
  }
  // fill
  for (i = 0; i < ROADS.length; i++){
    r = ROADS[i];
    add({ id:"road-"+r[0], type:"line", source:"pm", "source-layer":"roads",
          minzoom:r[4], filter:["all", notBridge, detailIn(r[1])],
          layout:{ "line-cap":"round", "line-join":"round" },
          paint:{ "line-color":r[2], "line-width":w.apply(null, r[5]) } });
  }
  // 桥：整体画在地面道路之上，避免被下面的路面盖住
  add({ id:"bridge-case", type:"line", source:"pm", "source-layer":"roads", minzoom:12,
        filter:["==", ["get","is_bridge"], true],
        layout:{ "line-cap":"butt" },
        paint:{ "line-color":PM.majorCase, "line-width":w(12,3.2, 16,9, 18,20) } });
  add({ id:"bridge", type:"line", source:"pm", "source-layer":"roads", minzoom:12,
        filter:["==", ["get","is_bridge"], true],
        layout:{ "line-cap":"round", "line-join":"round" },
        paint:{ "line-color":PM.road, "line-width":w(12,1.6, 16,6, 18,16) } });

  // ===== 机场跑道 / 滑行道 =====
  // 这是本地数据里现成却一直没画的部分：浦东 z14 就有 406 条滑行道、52 条跑道。
  add({ id:"aeroway-taxiway-case", type:"line", source:"pm", "source-layer":"roads", minzoom:12,
        filter:detailIn(["taxiway"]),
        layout:{ "line-cap":"round", "line-join":"round" },
        paint:{ "line-color":PM.aeroCase, "line-width":w(12,1.2, 15,4, 18,13) } });
  add({ id:"aeroway-taxiway", type:"line", source:"pm", "source-layer":"roads", minzoom:12,
        filter:detailIn(["taxiway"]),
        layout:{ "line-cap":"round", "line-join":"round" },
        paint:{ "line-color":"#f7f6fa", "line-width":w(12,0.6, 15,2.6, 18,10) } });
  add({ id:"aeroway-runway-case", type:"line", source:"pm", "source-layer":"roads", minzoom:10,
        filter:detailIn(["runway"]),
        layout:{ "line-cap":"butt" },
        paint:{ "line-color":PM.aeroCase, "line-width":w(10,2, 13,7, 18,34) } });
  add({ id:"aeroway-runway", type:"line", source:"pm", "source-layer":"roads", minzoom:10,
        filter:detailIn(["runway"]),
        layout:{ "line-cap":"butt" },
        paint:{ "line-color":"#ffffff", "line-width":w(10,1.2, 13,5, 18,28) } });

  // ===== 轨道 =====
  add({ id:"rail-case", type:"line", source:"pm", "source-layer":"roads", minzoom:11,
        filter:detailIn(["rail","light_rail","monorail"]),
        paint:{ "line-color":PM.railCase, "line-width":w(11,1.2, 16,4) } });
  add({ id:"rail", type:"line", source:"pm", "source-layer":"roads", minzoom:11,
        filter:detailIn(["rail","light_rail","monorail"]),
        paint:{ "line-color":"#f3f0ea", "line-width":w(11,0.6, 16,2),
                "line-dasharray":[2.5,2.5] } });
  add({ id:"rail-subway", type:"line", source:"pm", "source-layer":"roads", minzoom:13,
        filter:detailIn(["subway"]),
        paint:{ "line-color":PM.rail, "line-width":w(13,0.6, 17,2),
                "line-dasharray":[3,2], "line-opacity":0.7 } });
  add({ id:"ferry", type:"line", source:"pm", "source-layer":"roads", minzoom:9,
        filter:["==", ["get","kind"], "ferry"],
        paint:{ "line-color":PM.waterInk, "line-width":w(9,0.5, 14,1.2),
                "line-dasharray":[4,3], "line-opacity":0.6 } });

  // ===== 建筑 =====
  add({ id:"buildings", type:"fill", source:"pm", "source-layer":"buildings", minzoom:14,
        filter:["==", ["get","kind"], "building"],
        paint:{ "fill-color":PM.bldg, "fill-outline-color":PM.bldgCase } });

  // ===== 行政边界 =====
  // kind_detail 是行政级别：country=2 / region=4 / county=5,6 / locality=8
  add({ id:"boundary-county", type:"line", source:"pm", "source-layer":"boundaries", minzoom:8,
        filter:kindIn(["county","locality"]),
        paint:{ "line-color":PM.bound, "line-dasharray":[2,3],
                "line-width":w(8,0.4, 13,1), "line-opacity":0.7 } });
  add({ id:"boundary-region", type:"line", source:"pm", "source-layer":"boundaries", minzoom:4,
        filter:kindIn(["region"]),
        paint:{ "line-color":PM.bound, "line-dasharray":[4,2],
                "line-width":w(4,0.5, 10,1.4) } });
  add({ id:"boundary-country", type:"line", source:"pm", "source-layer":"boundaries",
        filter:kindIn(["country"]),
        paint:{ "line-color":"#b3aa9e", "line-width":w(2,0.7, 8,2, 12,3) } });

  // ===== 标注 =====
  // 统一的光晕参数，保证任何底色上都读得清
  function halo(hw){ return { "text-color":PM.ink, "text-halo-color":PM.halo,
                              "text-halo-width":hw || 1.5, "text-halo-blur":0.3 }; }

  // 水体：线状河流沿线排字，面状湖海居中排字
  add({ id:"water-label-line", type:"symbol", source:"pm", "source-layer":"water", minzoom:12,
        filter:["all", ["==", ["geometry-type"], "LineString"], ["has","name"]],
        layout:{ "text-field":PM_NAME, "text-font":PM_FONT, "symbol-placement":"line",
                 "text-size":11, "text-letter-spacing":0.05 },
        paint:{ "text-color":PM.waterInk, "text-halo-color":PM.halo, "text-halo-width":1.2 } });
  add({ id:"water-label", type:"symbol", source:"pm", "source-layer":"water", minzoom:8,
        filter:["all", ["==", ["geometry-type"], "Polygon"], ["has","name"]],
        layout:{ "text-field":PM_NAME, "text-font":PM_FONT, "text-max-width":7,
                 "text-size":["interpolate",["linear"],["zoom"], 8,10, 14,13] },
        paint:{ "text-color":PM.waterInk, "text-halo-color":PM.halo, "text-halo-width":1.2 } });

  // 道路名
  add({ id:"road-label", type:"symbol", source:"pm", "source-layer":"roads", minzoom:13,
        filter:["all", ["has","name"],
                       kindIn(["highway","major_road","medium_road","minor_road"])],
        layout:{ "text-field":PM_NAME, "text-font":PM_FONT, "symbol-placement":"line",
                 "text-size":["interpolate",["linear"],["zoom"], 13,10, 17,12],
                 "symbol-spacing":260 },
        paint:{ "text-color":PM.dim, "text-halo-color":PM.halo, "text-halo-width":1.4 } });

  // POI：用 Protomaps 自带的 min_zoom 控密度，比一刀切好得多。
  // 只挑对看图有用的类别，餐饮零售这些留给在线底图。
  add({ id:"poi-label", type:"symbol", source:"pm", "source-layer":"pois", minzoom:14,
        filter:["all", ["has","name"], [">=", ["zoom"], ["get","min_zoom"]],
                 // 航空类排在最前：这是机场地图，航站楼/机库/停机坪比博物馆重要
                 kindIn(["terminal","hangar","apron","helipad","gate","runway",
                         "hospital","school","university","college","museum","library",
                         "park","attraction","station","bus_station","marina","stadium",
                         "theatre","zoo","peak","police","fire_station","townhall",
                         "place_of_worship","nature_reserve","golf_course"])],
        layout:{ "text-field":PM_NAME, "text-font":PM_FONT, "text-max-width":8,
                 "text-size":11, "text-anchor":"top", "text-offset":[0,0.4],
                 "text-optional":true },
        paint:{ "text-color":PM.poi, "text-halo-color":PM.halo, "text-halo-width":1.3 } });

  // 机场名：独立一层且给较高优先级，机场地图上这个不能被别的标注挤掉
  add({ id:"aerodrome-label", type:"symbol", source:"pm", "source-layer":"pois", minzoom:11,
        filter:["all", ["has","name"], ["==", ["get","kind"], "aerodrome"]],
        layout:{ "text-field":PM_NAME, "text-font":PM_FONT, "text-max-width":9,
                 "text-size":["interpolate",["linear"],["zoom"], 11,10, 15,13],
                 "symbol-sort-key":0 },
        paint:{ "text-color":"#6a6478", "text-halo-color":PM.halo, "text-halo-width":1.6 } });

  // 地名：按 kind_detail 分层，越重要的层放得越靠后（越晚画越不容易被挤掉）
  add({ id:"place-neighbourhood", type:"symbol", source:"pm", "source-layer":"places", minzoom:13,
        filter:kindIn(["neighbourhood","macrohood"]),
        layout:{ "text-field":PM_NAME, "text-font":PM_FONT, "text-max-width":7,
                 "text-size":["interpolate",["linear"],["zoom"], 13,10, 16,12],
                 "text-letter-spacing":0.04, "text-transform":"uppercase" },
        paint:{ "text-color":PM.dim, "text-halo-color":PM.halo, "text-halo-width":1.4 } });
  // 乡村小地名从 z9 就放出来：在线底图在 z10 的弗吉尼亚能标十几个村镇，卡在 z11 只剩 3 个。
  // 密度不用 min_zoom 硬筛（实测那样会把苏黎世的标注从 86 砍到 44，而弗吉尼亚一个都
  // 没多出来——Protomaps 对小地名给的 min_zoom 比在线保守得多），改为交给 MapLibre 的
  // 碰撞检测：放不下的自动丢弃。min_zoom 只拿来当排序键，值越小越重要、越优先保留。
  add({ id:"place-village", type:"symbol", source:"pm", "source-layer":"places", minzoom:9,
        filter:detailIn(["village","hamlet","isolated_dwelling","farm","locality"]),
        layout:{ "text-field":PM_NAME, "text-font":PM_FONT, "text-max-width":7,
                 "text-size":["interpolate",["linear"],["zoom"], 9,9.5, 15,12],
                 "symbol-sort-key":["coalesce", ["get","min_zoom"], 15] },
        paint:halo(1.4) });
  add({ id:"place-town", type:"symbol", source:"pm", "source-layer":"places", minzoom:8,
        filter:detailIn(["town","suburb"]),
        layout:{ "text-field":PM_NAME, "text-font":PM_FONT, "text-max-width":7,
                 "text-size":["interpolate",["linear"],["zoom"], 8,11, 14,14] },
        paint:halo(1.5) });
  add({ id:"place-city", type:"symbol", source:"pm", "source-layer":"places", minzoom:4,
        filter:detailIn(["city"]),
        layout:{ "text-field":PM_NAME, "text-font":PM_FONT, "text-max-width":8,
                 "text-size":["interpolate",["linear"],["zoom"], 4,11, 8,14, 13,18] },
        paint:halo(1.8) });
  add({ id:"place-region", type:"symbol", source:"pm", "source-layer":"places",
        minzoom:4, maxzoom:9, filter:kindIn(["region"]),
        layout:{ "text-field":PM_NAME, "text-font":PM_FONT, "text-max-width":8,
                 "text-size":["interpolate",["linear"],["zoom"], 4,10, 8,13],
                 "text-letter-spacing":0.08, "text-transform":"uppercase" },
        paint:{ "text-color":PM.dim, "text-halo-color":PM.halo, "text-halo-width":1.5 } });
  add({ id:"place-country", type:"symbol", source:"pm", "source-layer":"places", maxzoom:8,
        filter:kindIn(["country"]),
        layout:{ "text-field":PM_NAME, "text-font":PM_FONT, "text-max-width":8,
                 "text-size":["interpolate",["linear"],["zoom"], 2,11, 6,15],
                 "text-letter-spacing":0.06 },
        paint:halo(1.8) });

  return { version:8, glyphs:GLYPH_URL, sources:src, layers:L,
           _maxzoom: maxzoom || 15 };
}

// ---------- 底图切换 ----------
// 三种底图，按可用性自动选择：
//   pmtiles  本地 Protomaps 矢量瓦片（街道级，需 HTTP 服务器，走 Range 请求）
//   online   OpenFreeMap 在线瓦片
//   offline  本地 Natural Earth（粗略，file:// 双击也能用）
var PMTILES_CANDIDATES = ["tiles/planet.pmtiles", "tiles/global-z9.pmtiles",
                          "tiles/test-yrd.pmtiles"];   // 按顺序探测，用第一个存在的
var pmUrl = null, demOk = false;
var baseMode = "auto", onlineTimer = null, curHint = "", curAttrib = "ne";
// 3D 建筑：bldg3dHidden 记录被 3D 层顶替而临时隐藏的 2D 建筑层，关闭时逐个恢复；
// styleGen 每次重挂样式自增，用来作废上一份样式遗留的异步探测回调（map 级监听
// 不随 setStyle 清除，回调晚到时可能对着新样式乱动）。
var bldg3dHidden = [], styleGen = 0;

function hint(t){ curHint = t; document.getElementById("baseHint").textContent = t; }

function setAttrib(kind){
  curAttrib = kind;
  var box = document.getElementById("baseAttrib");
  box.innerHTML = "";
  if (kind === "pmtiles"){
    box.append(link("Protomaps", "https://protomaps.com"), " / ",
               link("OpenStreetMap", "https://www.openstreetmap.org/copyright"), "（本地）");
  } else if (kind === "ne"){
    box.append(link("Natural Earth", "https://www.naturalearthdata.com/"), "（本地）");
  } else {
    box.append(link("OpenFreeMap", "https://openfreemap.org/"), " / ",
               link("OpenStreetMap", "https://www.openstreetmap.org/copyright"));
  }
  if (demOk && document.getElementById("fHill").checked)
    box.append(" · 地形 ", link("AWS Terrain Tiles", "https://registry.opendata.aws/terrain-tiles/"));
}

// file:// 下 fetch 被阻止，探测只能在 http(s) 下进行
function probe(url){
  if (location.protocol === "file:") return Promise.resolve(false);
  return fetch(url, { method:"HEAD" }).then(function(r){ return r.ok; }).catch(function(){ return false; });
}
function detectAssets(){
  if (location.protocol === "file:") return Promise.resolve();
  var chain = Promise.resolve();
  PMTILES_CANDIDATES.forEach(function(u){
    chain = chain.then(function(){
      if (pmUrl) return;
      return probe(u).then(function(ok){ if (ok) pmUrl = u; });
    });
  });
  return chain.then(function(){
    return probe("tiles/dem/0/0/0.png").then(function(ok){
      demOk = ok;
      document.getElementById("fHill").disabled = !ok;
      document.getElementById("hillNote").textContent = ok ? "" : "无数据";
    });
  });
}

// 在线样式彻底加载不出来时 map.getStyle() 返回的是 undefined，直接点 .layers 会抛。
// 兜底回调里一抛异常就再也切不回本地了，所以这里必须先判空。
function styleFailed(){
  var st = map.getStyle();
  return !st || !st.layers || st.layers.length <= 3;
}

// mode 是内部的「实际用哪张底图」，取值 pmtiles / ne / online——注意跟下拉框里的
// offline 不是一回事：那个是用户意图，由 setBasemap 解析成这里的具体一档。
function useStyle(mode, reason){
  offline = (mode !== "online");
  clearTimeout(onlineTimer); onlineTimer = null;
  if (mode === "pmtiles"){
    map.setStyle(protomapsStyle(pmUrl), {diff:false});
  } else if (mode === "ne"){
    map.setStyle(offlineStyle(), {diff:false});
  } else {
    map.setStyle(STYLE_URL, {diff:false});
    onlineTimer = setTimeout(function(){
      if (!offline && styleFailed())
        offlineStack("在线底图不可用，已切换到");
    }, 8000);
  }
  activeMode = mode;
  hint(reason || ({ pmtiles:"本地街道级底图 · Protomaps",
                    online:"在线底图 · OpenFreeMap",
                    ne:"本地底图 · Natural Earth 1:50m" })[mode]);
}
var activeMode = "ne";

// 离线一档内部按 PMTILES_CANDIDATES 的预排顺序回落：detectAssets 已经按那个顺序
// 探过，pmUrl 就是第一个存在的包；一个都没有才退到 Natural Earth。
function offlineStack(why){
  if (pmUrl) useStyle("pmtiles", why + "本地街道级底图 · " + pmUrl.replace(/^tiles\//, ""));
  // file:// 下 probe() 直接返回 false，pmUrl 必然为空——这跟「文件真的不在」是两回事，
  // 提示要说清楚，否则用户会以为自己下的瓦片丢了
  else if (location.protocol === "file:")
    useStyle("ne", why + "file:// 无法探测本地瓦片，用 Natural Earth（改用 start.command 启动可读 PMTiles）");
  else useStyle("ne", why + "未找到 tiles/*.pmtiles，用 Natural Earth");
}

// 自动 = 有网走在线，没网读本地。navigator.onLine 只能确诊「网卡断了」，它为 true
// 时并不保证真连得通，所以还要靠 useStyle 里那个 8 秒兜底：样式没加载出来就切回本地。
function setBasemap(mode){
  baseMode = mode;
  if (mode === "offline"){
    offlineStack("离线 · ");
  } else if (mode === "auto"){
    if (navigator.onLine === false) offlineStack("自动 · 无网络，");
    else useStyle("online", "自动 · 在线底图 · OpenFreeMap");
  } else {
    useStyle(mode);
  }
}

// ---------- 山体阴影 ----------
function addHillshade(){
  if (!demOk || !document.getElementById("fHill").checked) return;
  if (map.getSource("dem")) return;
  map.addSource("dem", {
    type:"raster-dem", tiles:[location.origin + location.pathname.replace(/[^/]*$/, "") + "tiles/dem/{z}/{x}/{y}.png"],
    tileSize:256, encoding:"terrarium", maxzoom:8   // 只下到 z8，更高缩放由 MapLibre overzoom
  });
  // 插在第一个线图层（道路）之前：地形阴影应垫在道路和标注之下，
  // 否则会把路网糊掉。用带 alpha 的柔和色，避免山地过曝成一片白。
  var before = null, ls = map.getStyle().layers;
  for (var i=0;i<ls.length;i++)
    if (ls[i].type === "line" || ls[i].type === "symbol"){ before = ls[i].id; break; }
  map.addLayer({ id:"hillshade", type:"hillshade", source:"dem",
    paint:{ "hillshade-exaggeration":0.28,
            "hillshade-shadow-color":"rgba(88,96,112,0.34)",
            "hillshade-highlight-color":"rgba(255,255,255,0.22)",
            "hillshade-accent-color":"rgba(0,0,0,0)" } }, before);
}
function toggleHill(){
  if (document.getElementById("fHill").checked){
    addHillshade();
  } else if (map.getLayer("hillshade")){
    map.removeLayer("hillshade"); map.removeSource("dem");
  }
  setAttrib(curAttrib);
}

// ---------- 3D 建筑 ----------
// 两套底图的建筑 schema 完全不同：
//   pmtiles(Protomaps)  source-layer "buildings"，高度字段 height / min_height
//   online(OpenMapTiles) source-layer "building"，高度字段 render_height / render_min_height，
//                        另有 hide_3d 标记（高缩放下会同时出现整楼与楼层部件，标记者不该拉伸）
// Natural Earth 没有建筑数据。3D 层一律运行时添加，不烘进 protomapsStyle，
// 这样三种底图共用一条代码路径。

// 当前 pmtiles 包能否画出建筑：null=未探明。pmUrl 全程不变，故探明一次即可缓存
var pmBldgOk = null, pmBldgWhy = "", pmBldgProbing = false;

// 从当前样式反推在线底图的建筑源，比硬编码 source 名抗改版
function findBuildingLayers(){
  if (!map || !map.getStyle()) return null;
  var ls = map.getStyle().layers || [], src = null, hide = [];
  for (var i=0;i<ls.length;i++){
    var l = ls[i];
    if (l["source-layer"] !== "building") continue;
    if (!src) src = l.source;
    if (l.type === "fill" || l.type === "line") hide.push(l.id);
  }
  return src ? { source:src, hide:hide } : null;
}

// source 上的 maxzoom 要等 TileJSON 落地才是真的，而 pmtiles 得先跑完 header 的 Range
// 请求 —— style.load 时几乎一定还没到，只能等 sourcedata。判断落地与否看 tiles 数组：
// url 型 source 在 TileJSON 回来之前没有它，回来之后连同 minzoom/maxzoom 一起被写入。
function pmSourceReady(cb){
  var s = map.getSource("pm");
  if (s && s.tiles){ cb(s); return; }
  var gen = styleGen;
  function onData(e){
    if (styleGen !== gen){ map.off("sourcedata", onData); return; }   // 样式已切走，作废
    if (e.sourceId !== "pm") return;
    var s2 = map.getSource("pm");
    if (!s2 || !s2.tiles) return;
    map.off("sourcedata", onData);
    cb(s2);
  }
  map.on("sourcedata", onData);
}

// 探测结果晚到时纠正 UI。判据是归档真实的 maxzoom：Protomaps 的建筑几何从 z11 起才有，
// global-z9 这类低缩放包只到 z9，拉伸出来是一片空白。
// 不能改看图层清单 —— 一是 pmtiles.Protocol 默认不返回 vector_layers（要 {metadata:true}
// 才走 getTileJson），vectorLayerIds 通常是 undefined；二是 global-z9 从同一份 planet
// 构建截出，metadata 原样照抄，buildings 赫然在列，照样会误判成"有建筑"。
// 清单若碰巧可用（协议换了配置）就顺带一并核对。
function probePmBldg(){
  if (activeMode !== "pmtiles" || pmBldgOk !== null || pmBldgProbing) return;
  pmBldgProbing = true;   // 反复勾选不该在 TileJSON 到达前堆起一摞 sourcedata 监听
  pmSourceReady(function(s){
    pmBldgProbing = false;
    var ids = s.vectorLayerIds;
    var hasLayer = !ids || ids.indexOf("buildings") >= 0;
    pmBldgOk = hasLayer && s.maxzoom >= 11;
    pmBldgWhy = pmBldgOk ? ""
              : (hasLayer ? "此数据包只到 z" + s.maxzoom + "，无建筑" : "此数据包无建筑层");
    if (!pmBldgOk) removeBldg3d();
    updateBldg3dUI();
  });
}

function addBldg3d(){
  if (!document.getElementById("fBldg3d").checked) return;
  if (!map || map.getLayer("buildings-3d") || activeMode === "ne") return;

  // 14→14.7 的高度插值让建筑从平面"长起来"，避免跨过 minzoom 时整片弹出；
  // 没有高度字段的建筑给 8m 兜底，否则会塌成一张纸。
  var def, hide;
  if (activeMode === "pmtiles"){
    if (pmBldgOk === false) return;
    def = { id:"buildings-3d", type:"fill-extrusion", source:"pm",
      "source-layer":"buildings", minzoom:14,
      paint:{ "fill-extrusion-color":PM.bldg,
        "fill-extrusion-height":["interpolate",["linear"],["zoom"],
          14,0, 14.7,["coalesce",["get","height"],8]],
        "fill-extrusion-base":["interpolate",["linear"],["zoom"],
          14,0, 14.7,["coalesce",["get","min_height"],0]] } };
    hide = ["buildings"];
  } else {
    var b = findBuildingLayers();
    if (!b) return;
    def = { id:"buildings-3d", type:"fill-extrusion", source:b.source,
      "source-layer":"building", minzoom:14,
      filter:["!=",["get","hide_3d"],true],
      paint:{ "fill-extrusion-color":"#e0ddd8",
        "fill-extrusion-height":["interpolate",["linear"],["zoom"],
          14,0, 14.7,["coalesce",["get","render_height"],8]],
        "fill-extrusion-base":["interpolate",["linear"],["zoom"],
          14,0, 14.7,["coalesce",["get","render_min_height"],0]] } };
    hide = b.hide;
  }

  // 插在第一个标注层之前：建筑要压住道路，但不能盖掉地名。
  // （与 hillshade 不同——那个连道路一起垫在底下，所以它也认 line 层。）
  var before = null, ls = map.getStyle().layers;
  for (var i=0;i<ls.length;i++)
    if (ls[i].type === "symbol"){ before = ls[i].id; break; }
  map.addLayer(def, before);

  // 2D 建筑面留在下面会与 3D 底座错开半个身位，描边糊成脏边，先藏起来
  for (var j=0;j<hide.length;j++){
    if (!map.getLayer(hide[j])) continue;
    map.setLayoutProperty(hide[j], "visibility", "none");
    bldg3dHidden.push(hide[j]);
  }
}

function removeBldg3d(){
  if (map.getLayer("buildings-3d")) map.removeLayer("buildings-3d");
  for (var i=0;i<bldg3dHidden.length;i++)
    if (map.getLayer(bldg3dHidden[i]))
      map.setLayoutProperty(bldg3dHidden[i], "visibility", "visible");
  bldg3dHidden = [];
}

function toggleBldg3d(){
  if (document.getElementById("fBldg3d").checked){
    addBldg3d();
    probePmBldg();
    // 正视图下 3D 完全看不出来，替用户仰起来。55 而不是顶格 60，留一点手动上仰余量。
    // 没真加上层（底图没建筑数据）就别动相机，否则白白歪一下什么也没多出来。
    if (map.getLayer("buildings-3d") && map.getPitch() < 5)
      map.easeTo({ pitch:55, duration:700 });
  } else {
    removeBldg3d();
    map.easeTo({ pitch:0, duration:500 });      // 关 3D 就回平面图，免得用户卡在斜视角
  }
}

// 置灰但不动 checked：记住用户意图，切回有建筑的底图时自动恢复（与 fHill 一致）
function updateBldg3dUI(){
  var ok = true, msg = "";
  if (activeMode === "ne"){ ok = false; msg = "无建筑数据"; }
  else if (activeMode === "pmtiles"){
    if (pmBldgOk === false){ ok = false; msg = pmBldgWhy; }
  } else if (!findBuildingLayers()){ ok = false; msg = "无建筑数据"; }
  document.getElementById("fBldg3d").disabled = !ok;
  document.getElementById("bldgNote").textContent = msg;
}

function newMap(style){
  var m = new maplibregl.Map({
    container:"map", style:style, center:[12,26], zoom:1.5,
    minZoom:1, maxZoom:18, attributionControl:false, renderWorldCopies:true,
    // 本地只内嵌了拉丁字形；中日韩文字交给系统字体在客户端渲染
    localIdeographFontFamily:"'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif"
  });
  // 指南针必须留着：3D 建筑会把视角仰起来，而 dragRotate 默认开启（右键拖拽即可转向），
  // 没有它用户没有任何复位手段。visualizePitch 让图标跟着俯仰倾斜，点一下同时归正方位与俯仰。
  m.addControl(new maplibregl.NavigationControl({visualizePitch:true}), "bottom-right");
  m.addControl(new maplibregl.ScaleControl({maxWidth:90}), "bottom-left");
  return m;
}

// setStyle 会清空所有 source/layer，必须在新样式加载完成后重新挂载。
// 用 style.load（setStyle 完成时精确触发）而非 styledata（加载途中多次触发、
// isStyleLoaded() 仍为 false，守卫会把重建整个吞掉）。
// ---------- 实时航班（可选，默认关闭）----------
// adsb.fi / adsb.lol 都不发 Access-Control-Allow-Origin，浏览器直连会被同源
// 策略拦下（file:// 的 null 源和 http://localhost 都实测过），所以必须走
// serve.py 的 /api/flights 代理。file:// 双击模式没有那个代理，入口直接禁用。
// 这是联网增强项：不勾选就一个请求都不发，离线仍是这个项目的默认形态。
var FL_POLL_MS = 10000;          // 轮询间隔。数据源是免费社区服务，别催它
var FL_MAX_NM  = 250;            // 与代理端 FLIGHT_MAX_DIST 对齐
var FL_EMPTY   = { type:"FeatureCollection", features:[] };
var flightsOn = false, flightTimer = null, flightSeq = 0, flightFails = 0;

function flightsSupported(){ return location.protocol !== "file:"; }

function planeIcon(){
  // 运行时画图标，而不是用 "✈" 这类字符：vendor/glyphs.js 只内嵌了拉丁 0-255，
  // U+2708 不在里面，离线字形服务器根本给不出这个字。
  var n = 24, c = document.createElement("canvas");
  c.width = c.height = n;
  var x = c.getContext("2d");
  x.fillStyle = "#fff";
  x.beginPath();
  x.moveTo(12,1); x.lineTo(14.6,10); x.lineTo(23,15.4); x.lineTo(23,17.6);
  x.lineTo(13.7,14.9); x.lineTo(13.2,19.6); x.lineTo(16.6,22); x.lineTo(16.6,23.4);
  x.lineTo(12,22.2); x.lineTo(7.4,23.4); x.lineTo(7.4,22); x.lineTo(10.8,19.6);
  x.lineTo(10.3,14.9); x.lineTo(1,17.6); x.lineTo(1,15.4); x.lineTo(9.4,10);
  x.closePath(); x.fill();
  return { width:n, height:n, data:new Uint8Array(x.getImageData(0,0,n,n).data) };
}

function addFlightLayer(){
  if (!map.hasImage("plane")) map.addImage("plane", planeIcon(), { sdf:true });
  if (map.getSource("flights")) return;
  map.addSource("flights", { type:"geojson", data:FL_EMPTY });
  map.addLayer({
    id:"flights", type:"symbol", source:"flights",
    layout:{ "visibility": flightsOn ? "visible" : "none",
             "icon-image":"plane", "icon-rotate":["get","tr"],
             "icon-rotation-alignment":"map", "icon-allow-overlap":true,
             "icon-ignore-placement":true,
             "icon-size":["interpolate",["linear"],["zoom"], 3,0.42, 7,0.62, 11,0.9] },
    // 按气压高度着色：低空暖、高空冷，一眼能分出进近的和巡航的
    paint:{ "icon-color":["interpolate",["linear"],["coalesce",["get","alt"],0],
              0,"#ff8a4a", 10000,"#ffd166", 25000,"#7fd4ff", 40000,"#c3b5ff"],
            "icon-halo-color":"rgba(8,12,18,.85)", "icon-halo-width":1.1 }
  });
  bindFlightTip();
}

function bindFlightTip(){
  if (bound["flights"]) return;
  bound["flights"] = 1;
  var tip = document.getElementById("tip");
  map.on("mousemove", "flights", function(e){
    map.getCanvas().style.cursor = "pointer";
    var p = e.features[0].properties, bits = [];
    if (p.cs)  bits.push(p.cs);
    if (p.ty)  bits.push(p.ty);
    if (p.reg) bits.push(p.reg);
    if (p.alt != null && p.alt !== "") bits.push(fmt(+p.alt) + " ft");
    if (p.gs  != null && p.gs  !== "") bits.push(Math.round(+p.gs) + " kt");
    tip.textContent = bits.join("  ·  ") || p.hex;
    tip.style.display = "block";
    tip.style.left = e.point.x + "px";
    tip.style.top  = e.point.y + "px";
  });
  map.on("mouseleave", "flights", function(){
    map.getCanvas().style.cursor = "";
    document.getElementById("tip").style.display = "none";
  });
}

function flightHint(t){ document.getElementById("flightHint").textContent = t || ""; }
function flightCount(t){ document.getElementById("flightCount").textContent = t || ""; }

function flightRadiusNm(){
  // 中心到视口东北角的距离即可覆盖整个视口；上限与代理端一致
  var b = map.getBounds(), c = map.getCenter(), R = 3440.065;
  var p1 = c.lat*Math.PI/180, p2 = b.getNorth()*Math.PI/180;
  var dp = p2-p1, dl = (b.getEast()-c.lng)*Math.PI/180;
  var a = Math.sin(dp/2)*Math.sin(dp/2) +
          Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
  var d = 2*R*Math.asin(Math.min(1, Math.sqrt(a)));
  return Math.max(10, Math.min(FL_MAX_NM, Math.ceil(d)));
}

function pollFlights(){
  if (!flightsOn || document.hidden) return;
  var c = map.getCenter(), seq = ++flightSeq;
  fetch("api/flights?lat=" + c.lat.toFixed(3) + "&lon=" + c.lng.toFixed(3) +
        "&dist=" + flightRadiusNm())
    .then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); })
    .then(function(res){
      if (seq !== flightSeq || !flightsOn) return;      // 已被更新的请求取代
      if (!res.ok) throw new Error(res.j && res.j.error ? res.j.error : "上游错误");
      flightFails = 0;
      var ac = res.j.ac || [], f = [];
      for (var i=0;i<ac.length;i++){
        var a = ac[i];
        f.push({ type:"Feature", geometry:{ type:"Point", coordinates:[a[5], a[4]] },
                 properties:{ hex:a[0], cs:a[1], reg:a[2], ty:a[3],
                              alt:a[6], gs:a[7], tr:a[8] || 0 } });
      }
      if (map.getSource("flights"))
        map.getSource("flights").setData({ type:"FeatureCollection", features:f });
      flightCount(fmt(f.length) + " 架");
      flightHint(res.j.src + " · " + new Date().toLocaleTimeString() +
                 " · 半径 " + flightRadiusNm() + " nm");
    })
    .catch(function(e){
      if (seq !== flightSeq) return;
      flightFails++;
      if (flightFails >= 3){                            // 别对着挂掉的上游死磕
        setFlights(false);
        flightHint("连续 3 次取数失败，已自动关闭。恢复网络后重新勾选即可。");
      } else {
        flightHint("取数失败（" + String(e.message).slice(0,60) + "），下次轮询重试");
      }
    });
}

function setFlights(on){
  flightsOn = !!on && flightsSupported();
  var cb = document.getElementById("fFlights");
  if (cb) cb.checked = flightsOn;
  if (map && map.getLayer("flights"))
    map.setLayoutProperty("flights", "visibility", flightsOn ? "visible" : "none");
  if (flightTimer){ clearInterval(flightTimer); flightTimer = null; }
  if (flightsOn){
    flightFails = 0;
    flightHint("正在获取…");
    pollFlights();
    flightTimer = setInterval(pollFlights, FL_POLL_MS);
  } else {
    flightSeq++;                                        // 作废在途请求
    if (map && map.getSource("flights")) map.getSource("flights").setData(FL_EMPTY);
    flightCount(""); flightHint("");
  }
}

function initFlightsUI(){
  var cb = document.getElementById("fFlights");
  if (!flightsSupported()){
    cb.disabled = true;
    flightHint("file:// 模式不可用：数据源不发 CORS 头，必须经 serve.py 代理。" +
               "请改用 start.command / start.bat 启动。");
    return;
  }
  cb.addEventListener("change", function(){ setFlights(cb.checked); });
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden && flightsOn) pollFlights();   // 切回来立刻刷新
  });
  var mv = null;
  map.on("moveend", function(){                         // 视口变了就重取，但要防抖
    if (!flightsOn) return;
    clearTimeout(mv);
    mv = setTimeout(pollFlights, 700);
  });
}

function onStyleReady(){
  if (map.getSource("ap")) return;
  // 旧样式的图层已随 setStyle 销毁，隐藏记录一并作废；上一份样式里挂着的探测也就此作废
  styleGen++; bldg3dHidden = []; pmBldgProbing = false;
  addHillshade();
  addBldg3d();
  addAirportLayers();
  addFlightLayer();          // 样式重建会销毁旧图层，航班层要跟着重挂
  if (!ready){ ready = true; bindMapEvents(); document.getElementById("boot").style.display = "none"; }
  setAttrib(activeMode);
  updateBldg3dUI(); probePmBldg();
  refresh();
}

// 供自动化验收读取运行时状态（无副作用）

};

                 flights:function(on){ setFlights(!!on); },

                 rowOf:function(ident){ for(var i=0;i<rows.length;i++) if(rows[i][IDENT]===ident) return rows[i]; } };

function boot(){
  // pmtiles 协议：让 MapLibre 能从单个大文件按 Range 读瓦片
  if (window.pmtiles && maplibregl.addProtocol){
    maplibregl.addProtocol("pmtiles", new pmtiles.Protocol().tile);
  }
  document.getElementById("fBase").addEventListener("change", function(){ setBasemap(this.value); });
  document.getElementById("fHill").addEventListener("change", toggleHill);
  document.getElementById("fBldg3d").addEventListener("change", toggleBldg3d);

  detectAssets().then(function(){
    // 首帧走的是和 setBasemap("auto") 同一套判断：有网就在线，没网按预排顺序读本地
    var goOnline = navigator.onLine !== false;
    activeMode = goOnline ? "online" : (pmUrl ? "pmtiles" : "ne");
    offline = !goOnline;
    map = newMap(goOnline ? STYLE_URL
                          : (pmUrl ? protomapsStyle(pmUrl) : offlineStyle()));
    map.on("load", onStyleReady);
    map.on("style.load", onStyleReady);
    hint({ online:"自动 · 在线底图载入中…",
           pmtiles:"自动 · 无网络，用本地街道级底图",
           ne:"自动 · 无网络，用 Natural Earth" }[activeMode]);
    if (goOnline){
      onlineTimer = setTimeout(function(){
        if (!offline && styleFailed())
          offlineStack("在线底图不可用，已切换到");
      }, 8000);
    }
  });
}

boot();
})();
</script>
